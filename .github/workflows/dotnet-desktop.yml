name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller uiautomation
      - run: pyinstaller --onefile --noconsole --name TapeFinder --hidden-import uiautomation --hidden-import comtypes tape_finder.py
      - uses: actions/upload-artifact@v4
        with:
          name: TapeFinder-exe
          path: dist/TapeFinder.exe
